name: Render PlantUML

permissions:
  contents: write

on:
  push:
    paths:
      - 'Diagram/**/*.puml'
      - '.github/workflows/render-diagrams.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install PlantUML
        run: sudo apt-get update && sudo apt-get install -y plantuml

      - name: Render PlantUML diagrams to SVG
        run: |
          mkdir -p Diagram/rendered
          for file in Diagram/*.puml; do
            plantuml -tsvg "$file" -o ./rendered
          done

      - name: Commit rendered diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add Diagram/rendered/*.svg || echo "No files to add"
          git diff --cached --quiet || git commit -m "Auto-render PlantUML diagrams"
          git push
